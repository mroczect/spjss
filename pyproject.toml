[project]
name = "spjss"
version = "0.3.1"
description = "GUI client for Frappe / ERPNext via librjss-ffi"
readme = "README.md"
authors = [
    { name = "mroczect", email = "mroczect@proton.me" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["frappe", "erpnext", "tkinter", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    "keyring>=25.7.0",
    "pypdf>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pyinstaller>=6.10",
]

[project.scripts]
spjss = "spjss.__main__:main"

[project.urls]
Homepage = "https://github.com/mroczect/librjss"
Repository = "https://github.com/mroczect/librjss"
Issues = "https://github.com/mroczect/librjss/issues"

[build-system]
requires = ["uv_build>=0.12.19"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = [
    "pywin32-ctypes==0.2.3",
]

[tool.uv.build-backend]
module-root = "src"
module-name = "spjss"
wheel-exclude = [
    "**/__pycache__",
    "**/*.pyc",
]
source-include = [
    "src/spjss/data/*.txt",
    "src/spjss/_native/*.so",
    "src/spjss/_native/*.dylib",
    "src/spjss/_native/*.dll",
    "src/spjss/_native/*.lib",
    "src/spjss/_native/*.h",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/spjss/_native/librjss.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
