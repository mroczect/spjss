[project]
name = "spjss"
version = "0.1.0"
description = "GUI client for Frappe / ERPNext via librjss-ffi"
readme = "README.md"
authors = [
    { name = "mroczect", email = "mroczect@proton.me" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["frappe", "erpnext", "tkinter", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
keyring = ["keyring>=24"]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[project.scripts]
spjss = "spjss.__main__:main"

[project.urls]
Homepage = "https://github.com/mroczect/librjss"
Repository = "https://github.com/mroczect/librjss"
Issues = "https://github.com/mroczect/librjss/issues"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "spjss"
# keep the native library and any non-Python data files in the wheel
wheel-exclude = [
    "**/__pycache__",
    "**/*.pyc",
]
source-include = [
    "src/spjss/data/*.txt",
    "src/spjss/_native/*.so",
    "src/spjss/_native/*.dylib",
    "src/spjss/_native/*.dll",
    "src/spjss/_native/*.lib",
    "src/spjss/_native/*.h",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"src/spjss/_native/librjss.py" = [
    "E402",  # module-level import not at top (lib = _load() must run first)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
