name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.1)'
        required: true

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  LIBRJSS_VERSION: 'v2.3.0'

jobs:
  windows:
    name: build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Resolve tag and version
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            "${{ github.event.inputs.tag }}"
          }
          if (-not $tag) { throw "no tag resolved" }
          $ver = $tag -replace '^v', ''
          "tag=$tag"      >> $env:GITHUB_OUTPUT
          "version=$ver"  >> $env:GITHUB_OUTPUT
          Write-Host "Tag     : $tag"
          Write-Host "Version : $ver"

      - name: Sync version into source files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:VERSION
          Write-Host "Syncing version $v"

          # pyproject.toml — only the top-level [project] version
          $pyproject = Get-Content pyproject.toml -Raw
          $pyproject = $pyproject -replace '(?m)^version = "[^"]*"', "version = `"$v`""
          Set-Content -Path pyproject.toml -Value $pyproject -NoNewline

          # src/spjss/__init__.py
          $init = Get-Content src/spjss/__init__.py -Raw
          $init = $init -replace '(?m)^__version__ = "[^"]*"', "__version__ = `"$v`""
          Set-Content -Path src/spjss/__init__.py -Value $init -NoNewline

          # installer.iss
          $iss = Get-Content installer.iss -Raw
          $iss = $iss -replace '(?m)^#define AppVersion "[^"]*"', "#define AppVersion `"$v`""
          Set-Content -Path installer.iss -Value $iss -NoNewline

          Write-Host "--- verify ---"
          Select-String -Path pyproject.toml -Pattern '^version = ' | Select-Object -First 1
          Select-String -Path src/spjss/__init__.py -Pattern '^__version__ = '
          Select-String -Path installer.iss -Pattern '#define AppVersion'

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Fetch librjss-ffi DLL
        shell: pwsh
        run: |
          $base = "https://github.com/mroczect/librjss/releases/download/${{ env.LIBRJSS_VERSION }}"
          New-Item -ItemType Directory -Force -Path src/spjss/_native | Out-Null

          Write-Host "Downloading $base/librjss_ffi.dll"
          curl.exe -L --fail --retry 3 -o src/spjss/_native/librjss_ffi.dll "$base/librjss_ffi.dll"

          if (-not (Test-Path src/spjss/_native/librjss_ffi.dll)) {
            throw "librjss_ffi.dll download failed"
          }
          $dll = Get-Item src/spjss/_native/librjss_ffi.dll
          Write-Host "DLL size: $($dll.Length) bytes"

          Get-ChildItem src/spjss/_native

      - name: Build spjss.exe with PyInstaller
        run: uv run pyinstaller spjss.spec --clean --noconfirm

      - name: Verify exe
        shell: pwsh
        run: |
          if (-not (Test-Path dist/spjss.exe)) { throw "dist/spjss.exe missing" }
          Get-Item dist/spjss.exe | Format-List Name, Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem installer_out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spjss-windows
          path: |
            dist/spjss.exe
            installer_out/spjss-setup-*.exe
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $installer = Get-ChildItem installer_out\spjss-setup-*.exe |
                       Select-Object -First 1
          $exe = Get-Item dist\spjss.exe

          Write-Host "Tag       : $env:TAG"
          Write-Host "Installer : $($installer.FullName)"
          Write-Host "Exe       : $($exe.FullName)"

          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title $env:TAG --generate-notes
          }

          gh release upload $env:TAG $installer.FullName $exe.FullName --clobber
