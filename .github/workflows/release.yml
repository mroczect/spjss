name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.6)"
        required: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  LIBRJSS_VERSION: "v2.3.0"

jobs:
  windows:
    name: build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── sanity: pastikan semua file yang dibutuhkan ada ─────────────
      - name: Verify required files
        shell: pwsh
        run: |
          $required = @(
            "pyproject.toml",
            "uv.lock",
            "spjss.spec",
            "installer.iss",
            "main.py",
            "assets\spjss.ico",
            "src\spjss\__init__.py",
            "src\spjss\data\license.txt"
          )
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              $missing += $f
              Write-Host "MISSING: $f" -ForegroundColor Red
            } else {
              Write-Host "ok: $f"
            }
          }
          if ($missing.Count -gt 0) {
            throw "missing required files: $($missing -join ', ')"
          }
      - name: Verify icon
        shell: pwsh
        run: |
          $path = "assets\spjss.ico"
          $bytes = [System.IO.File]::ReadAllBytes($path)

          # header: reserved(2) type(2) count(2) — type harus 1
          if ($bytes[0] -ne 0 -or $bytes[1] -ne 0 -or
              $bytes[2] -ne 1 -or $bytes[3] -ne 0) {
            throw "$path is not a valid .ico (bad magic bytes)"
          }
          $count = [BitConverter]::ToUInt16($bytes, 4)
          Write-Host "icon contains $count image(s)"
          if ($count -lt 2) {
            Write-Warning "ico has only $count size — Windows may upscale blurry"
          }
          Write-Host "size on disk: $((Get-Item $path).Length) bytes"
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Resolve tag and version
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            "${{ github.event.inputs.tag }}"
          }
          if (-not $tag) { throw "no tag resolved" }
          if ($tag -notmatch '^v') { $tag = "v$tag" }
          $ver = $tag -replace '^v', ''
          "tag=$tag"      >> $env:GITHUB_OUTPUT
          "version=$ver"  >> $env:GITHUB_OUTPUT
          Write-Host "Tag     : $tag"
          Write-Host "Version : $ver"

      # ── version sync ke semua file ──────────────────────────────────
      - name: Sync version into source files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:VERSION
          Write-Host "Syncing version $v"

          # pyproject.toml — only the top-level [project] version
          $pyproject = Get-Content pyproject.toml -Raw
          $pyproject = $pyproject -replace `
            '(?m)^version = "[^"]*"', "version = `"$v`""
          Set-Content -Path pyproject.toml -Value $pyproject -NoNewline

          # src/spjss/__init__.py
          $init = Get-Content src/spjss/__init__.py -Raw
          $init = $init -replace `
            '(?m)^__version__ = "[^"]*"', "__version__ = `"$v`""
          Set-Content -Path src/spjss/__init__.py -Value $init -NoNewline

          # installer.iss
          $iss = Get-Content installer.iss -Raw
          $iss = $iss -replace `
            '(?m)^#define AppVersion "[^"]*"', "#define AppVersion `"$v`""
          Set-Content -Path installer.iss -Value $iss -NoNewline

          Write-Host "--- verify ---"
          Select-String -Path pyproject.toml -Pattern '^version = ' |
            Select-Object -First 1
          Select-String -Path src/spjss/__init__.py -Pattern '^__version__ = '
          Select-String -Path installer.iss -Pattern '#define AppVersion'

      # ── install deps ────────────────────────────────────────────────
      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # ── native DLL ──────────────────────────────────────────────────
      - name: Fetch librjss-ffi DLL
        shell: pwsh
        run: |
          $base = "https://github.com/mroczect/librjss/releases/download/${{ env.LIBRJSS_VERSION }}"
          New-Item -ItemType Directory -Force -Path src/spjss/_native | Out-Null

          Write-Host "Downloading $base/librjss_ffi.dll"
          curl.exe -L --fail --retry 3 -o src/spjss/_native/librjss_ffi.dll "$base/librjss_ffi.dll"

          if (-not (Test-Path src/spjss/_native/librjss_ffi.dll)) {
            throw "librjss_ffi.dll download failed"
          }
          $dll = Get-Item src/spjss/_native/librjss_ffi.dll
          Write-Host "DLL size: $($dll.Length) bytes"

          Get-ChildItem src/spjss/_native

      # ── build exe ───────────────────────────────────────────────────
      - name: Build spjss.exe with PyInstaller
        run: uv run pyinstaller spjss.spec --clean --noconfirm

      - name: Verify exe
        shell: pwsh
        run: |
          if (-not (Test-Path dist/spjss.exe)) {
            throw "dist/spjss.exe missing"
          }
          $exe = Get-Item dist/spjss.exe
          Write-Host "spjss.exe size: $($exe.Length) bytes"

          # assert icon embedded
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)
          if (-not $icon) {
            throw "spjss.exe has no icon embedded"
          }
          Write-Host "icon embedded: $($icon.Width)x$($icon.Height)"

      # ── Inno Setup ──────────────────────────────────────────────────
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }

          # log ISCC ke file supaya mudah debug kalau gagal
          & $iscc installer.iss | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "--- iscc.log ---"
            Get-Content iscc.log
            throw "ISCC failed with exit code $LASTEXITCODE"
          }

          $installer = Get-ChildItem installer_out\spjss-setup-*.exe
          if (-not $installer) {
            throw "no installer produced in installer_out/"
          }
          foreach ($f in $installer) {
            Write-Host "installer: $($f.Name) — $($f.Length) bytes"
          }

      # ── artifacts ───────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spjss-windows
          path: |
            dist/spjss.exe
            installer_out/spjss-setup-*.exe
          if-no-files-found: error

      # ── release ─────────────────────────────────────────────────────
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $installer = Get-ChildItem installer_out\spjss-setup-*.exe |
                       Select-Object -First 1
          $exe = Get-Item dist\spjss.exe

          Write-Host "Tag       : $env:TAG"
          Write-Host "Installer : $($installer.FullName)"
          Write-Host "Exe       : $($exe.FullName)"

          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title $env:TAG --generate-notes
          }

          gh release upload $env:TAG $installer.FullName $exe.FullName --clobber
